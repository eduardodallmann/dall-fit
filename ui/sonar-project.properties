sonar.projectKey=dall-fit-ui
sonar.organization=dall-fit

sonar.sources=src
sonar.exclusions=node_modules/**,dist/**,coverage/**,playwright-report/**,src/**/*.test.tsx,src/**/*.test.ts,src/**/*.spec.tsx,src/**/*.spec.ts,src/**/__tests__/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*

sonar.qualitygate.wait=true
