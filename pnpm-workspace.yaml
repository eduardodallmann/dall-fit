packages:
  - api
  - ui
  - workflow
  - packages/*

minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.10'
  - '@nestjs/schematics@12.0.10'
  - '@vercel/cli-config@0.3.2'
  - '@vercel/functions@3.10.2'
  - '@vercel/oidc@4.0.2'
  - '@workflow/astro@5.0.6'
  - '@workflow/builders@5.0.6'
  - '@workflow/cli@5.0.6'
  - '@workflow/core@5.2.3'
  - '@workflow/errors@5.0.5'
  - '@workflow/nest@5.1.4'
  - '@workflow/next@5.0.6'
  - '@workflow/nitro@5.0.6'
  - '@workflow/nuxt@5.0.6'
  - '@workflow/rollup@5.0.6'
  - '@workflow/sveltekit@5.0.6'
  - '@workflow/vite@5.0.6'
  - '@workflow/vitest@5.0.6'
  - '@workflow/web@5.0.6'
  - '@workflow/world@5.0.5'
  - '@workflow/world-local@5.1.2'
  - '@workflow/world-vercel@5.2.3'
  - lucide-react@1.61.0
  - vite@8.3.5
  - workflow@5.2.3

overrides:
  'xcode@3.0.1>uuid': 11.1.1

allowBuilds:
