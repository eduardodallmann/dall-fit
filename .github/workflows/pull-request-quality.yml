name: Pull request quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:4000
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure memory-server cache directories
        run: |
          echo "MONGOMS_DOWNLOAD_DIR=${{ runner.temp }}/mongodb-binaries" >> "$GITHUB_ENV"
          echo "REDISMS_DOWNLOAD_DIR=${{ runner.temp }}/redis-binaries" >> "$GITHUB_ENV"

      - name: Restore memory-server binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/mongodb-binaries
            ${{ runner.temp }}/redis-binaries
          key: ${{ runner.os }}-${{ runner.arch }}-memory-servers-${{ hashFiles('package.json', 'api/package.json', 'pnpm-lock.yaml') }}

      - name: Diagnose workflow context
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "event=${{ github.event_name }}"
          echo "actor=${{ github.actor }}"
          echo "repository=${{ github.repository }}"
          echo "head_repository=${{ github.event.pull_request.head.repo.full_name }}"
          echo "head_ref=${{ github.head_ref }}"

          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN=EMPTY"
          else
            echo "SONAR_TOKEN=SET"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Run coverage tests
        run: pnpm test:coverage:ci

      - name: Run API end-to-end tests
        run: pnpm -C api test:e2e

      - name: Install Chromium
        run: pnpm -C ui test:integration:install:ci

      - name: Run UI integration tests
        run: pnpm test:integration

      - name: SonarCloud Analysis
        run: pnpm sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_PULL_REQUEST_KEY: ${{ github.event.pull_request.number }}
          SONAR_PULL_REQUEST_BRANCH: ${{ github.event.pull_request.head.ref }}
          SONAR_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.ref }}

      - name: Build
        run: pnpm build
